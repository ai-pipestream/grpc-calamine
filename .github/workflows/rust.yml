name: Rust

on: [ push, pull_request ]

jobs:
  rust:
    runs-on: ubuntu-latest
    # Docker Hardened Images Rust toolchain, the family the Dockerfile builds
    # from. dhi.io signs in with the Docker Hub org credentials.
    container:
      image: dhi.io/rust:1-dev
      credentials:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}
    strategy:
      matrix:
        toolchain:
          - "1.88"  # MSRV, matches calamine. Installed with rustup.
          - stable  # The hardened image's own toolchain, rustfmt and clippy.
          - beta    # Installed with rustup.
    steps:
    # The hardened image ships the Rust toolchain and a C linker only. The
    # actions need git and node, and rustup-managed toolchains need curl.
    - name: Install job tooling
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git nodejs
        # The workspace mount belongs to the runner user, not root.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    - name: Install Rust toolchain
      if: ${{ matrix.toolchain != 'stable' }}
      uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
      with:
          toolchain: ${{ matrix.toolchain }}
    - name: Toolchain version
      run: |
        cargo -vV
        rustc -vV
    - name: Build
      run: |
        cargo build
    - name: Run tests
      run: |
        cargo test
    - name: Format checks
      if: ${{ matrix.toolchain == 'stable' }}
      run: |
        cargo fmt -- --check
    - name: Clippy checks
      if: ${{ matrix.toolchain == 'stable' }}
      run: |
        cargo clippy --all-targets --all-features -- -Dwarnings

  proto:
    runs-on: ubuntu-latest
    # Docker Hardened Images Rust toolchain, the family the Dockerfile builds
    # from. dhi.io signs in with the Docker Hub org credentials.
    container:
      image: dhi.io/rust:1-dev
      credentials:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_TOKEN }}
    steps:
    # The hardened image ships the Rust toolchain and a C linker only. The
    # actions need git and node, and rustup-managed toolchains need curl.
    - name: Install job tooling
      run: |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git nodejs
        # The workspace mount belongs to the runner user, not root.
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    # Pinned so the descriptor comparison below is against one encoder. A
    # checksummed release download behaves the same on GitHub and Forgejo.
    - name: Install buf
      env:
        BUF_VERSION: 1.71.0
      run: |
        base="https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}"
        bin="buf-Linux-$(uname -m)"
        cd "$RUNNER_TEMP"
        curl -sSfLO "$base/$bin"
        curl -sSfL "$base/sha256.txt" | grep " $bin\$" | sha256sum -c -
        install -m 0755 "$bin" /usr/local/bin/buf
        buf --version
    - name: Lint the protobuf contract
      run: |
        buf lint
        buf build
    # src/gen is checked in, so nothing else notices when it falls behind the
    # contract: reflection once served comments the protos no longer had.
    - name: Install the codegen plugins
      run: |
        cargo install --locked protoc-gen-prost@0.5.0 protoc-gen-tonic@0.5.0
        echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
    - name: Generated code and descriptor match the contract
      run: |
        buf generate
        buf build -o src/gen/calamine/v1/calamine.v1.binpb
        git status --short -- src/gen
        test -z "$(git status --porcelain -- src/gen)"
