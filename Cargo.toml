[package]
name = "grpc-calamine"
version = "0.1.0"
description = "A gRPC server that streams Excel/OpenDocument workbooks parsed with calamine"
license = "Apache-2.0"
readme = "README.md"
keywords = ["excel", "ods", "grpc", "streaming", "calamine"]
categories = ["parsing", "network-programming"]
edition = "2024"
rust-version = "1.89" # uuid 1.28 needs 1.89; calamine needs 1.88.
publish = false # Server binary plus demos; not a library for crates.io.
# `bench/` is its own crate with a path dependency back on this one, so it is
# built and run explicitly and never lands in this package or in CI.
exclude = ["bench", "demos"]

[dependencies]
calamine = { version = "0.38.0", features = ["picture"] }
prost = "0.14.4"
# Already in the tree through calamine; used by src/archive.rs to read the
# `<sst>` count and the drawing anchors in the pre-open scan.
quick-xml = "0.42"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tonic = { version = "0.14.6", features = ["gzip", "zstd"] }
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
uuid = { version = "1.24.0", features = ["v4"] }
# Already in the tree through calamine, with the same features, so this adds
# no crate: the server reads the package itself first, to bound what calamine
# inflates when it opens one (src/archive.rs).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio-stream = { version = "0.1.19", features = ["net"] }

# The fork carries fixes and APIs this server needs that are not in a calamine
# release yet. The pinned commit is the fork's `pipestream-main-0.38` branch:
# upstream master after 0.38.0 (which already has tafia/calamine#695, reversed
# `<dimension ref>` normalisation) plus, in order:
#
#   #696  a cell reference beyond the grid (e.g. XFE1, A1048577) is an error,
#         checked while the reference is parsed
#   #697  `Range::from_sparse` returns an error past a fixed cell limit instead
#         of densifying without bound and aborting the process
#   ecbd87d  every anchor of an xlsx picture shares one copy of the image, and
#         a shared formula's `si` no longer sizes a Vec. Adds
#         `Reader::pictures_iter`, which the server uses.
#   f5ae782, 42fae6f  metadata-only declared tables, cell style ids, and full
#         source number-format identifiers and codes (`StyleNumberFormat`,
#         renamed from `NumberFormat`, which upstream now uses for styles).
#
# #696 and #697 are open upstream; the other three are fork-only so far.
# Pinned by `rev`, not by branch, so `cargo update` cannot move it: a newer
# fork commit is taken on purpose, by changing the rev here and in bench/.
# Drop this section once the required APIs and fixes are released.
[patch.crates-io]
calamine = { git = "https://github.com/ai-pipestream/calamine.git", rev = "42fae6f5669cb728944a51406c43c5a49224390d" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
