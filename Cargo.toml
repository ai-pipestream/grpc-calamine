[package]
name = "grpc-calamine"
version = "0.1.0"
description = "A gRPC server that streams Excel/OpenDocument workbooks parsed with calamine"
license = "Apache-2.0"
readme = "README.md"
keywords = ["excel", "ods", "grpc", "streaming", "calamine"]
categories = ["parsing", "network-programming"]
edition = "2024"
rust-version = "1.88" # Matches calamine's MSRV.
publish = false # Server binary plus demos; not a library for crates.io.
# `bench/` is its own crate with a path dependency back on this one, so it is
# built and run explicitly and never lands in this package or in CI.
exclude = ["bench", "demos"]

[dependencies]
calamine = { version = "0.36.0", features = ["picture"] }
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tonic = { version = "0.14.6", features = ["gzip", "zstd"] }
tonic-prost = "0.14.6"
tonic-reflection = "0.14.6"
uuid = { version = "1.24.0", features = ["v4"] }
# Already in the tree through calamine, with the same features, so this adds
# no crate: the server reads the package itself first, to bound what calamine
# inflates when it opens one (src/archive.rs).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio-stream = { version = "0.1.19", features = ["net"] }

# Three defects found by this server are fixed upstream in tafia/calamine#695,
# #696 and #697 but not yet released. The pinned commit is the fork's
# `pipestream-main` at 4fddaec: calamine 0.36.1 plus upstream master as of
# that merge (which brings #699, #701 and #707) plus those three fixes:
#
#   #695  a reversed `<dimension ref>` underflowed the extent arithmetic, so
#         `Dimensions::len()` reported 18_446_744_056_529_682_435 cells
#   #696  cell reference parsing overflowed u32 unchecked, so a crafted `r=`
#         yielded a cell position that appears nowhere in the file
#   #697  `Range::from_sparse` densified without bound, so a 2 KB worksheet
#         aborted the process through `handle_alloc_error` (uncatchable)
#
# Pinned by `rev`, not by branch, so `cargo update` cannot move it: a newer
# fork commit is taken on purpose, by changing the rev here and in bench/.
# Drop this section once the three land in a release; the fixes are additive
# and the server does not depend on any API they introduce.
[patch.crates-io]
calamine = { git = "https://github.com/ai-pipestream/calamine.git", rev = "4fddaec383809e70738e7615653008199626e5f3" }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
