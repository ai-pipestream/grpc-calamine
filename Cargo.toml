[package]
name = "grpc-calamine"
version = "0.1.0"
edition = "2024"

[dependencies]
calamine = { version = "0.36.0", path = "../../../reference-code/calamine", features = ["picture"] }
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tonic = "0.14.6"
tonic-prost = "0.14.6"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
tokio-stream = { version = "0.1.19", features = ["net"] }
