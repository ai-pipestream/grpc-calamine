[package]
name = "grpc-calamine-bench"
version = "0.1.0"
description = "Honest cost comparison between in-process calamine and grpc-calamine over the wire"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"
publish = false
# `cargo run` means the harness; the experiment binaries are run by name.
default-run = "grpc-calamine-bench"

[dependencies]
# Path dependency, so the benchmark provably links the same calamine build,
# the same feature set and the same conversion code as the server it measures.
grpc-calamine = { path = ".." }
calamine = { version = "0.36.0", features = ["picture"] }
prost = "0.14.4"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", features = ["gzip", "zstd"] }
serde_json = "1.0"
# For the byte-counting connector: wire size is measured at the socket rather
# than inferred from encoded payloads, so compression is measured honestly.
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# `bench` is its own crate, so it does not inherit the server's `[patch]`
# section. Without this it would link calamine from crates.io while the server
# links the fork, which would quietly break the "same calamine build" claim
# above and make the native-vs-gRPC comparison dishonest. Keep in step with the
# server's Cargo.toml; remove both together once the fixes are released.
[patch.crates-io]
calamine = { git = "https://github.com/ai-pipestream/calamine.git", branch = "pipestream-main" }
