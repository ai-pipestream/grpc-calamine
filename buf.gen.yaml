version: v2
# Code generation is driven by `buf generate` (never protoc directly).
# Install the plugins with:
#   cargo install --locked protoc-gen-prost@0.5.0 protoc-gen-tonic@0.5.0
# The versions and `--locked` matter: they reproduce src/gen byte for byte,
# which is what CI compares against. Newer prost-build releases format the
# same code differently.
plugins:
  - local: protoc-gen-prost
    out: src/gen
  - local: protoc-gen-tonic
    out: src/gen
